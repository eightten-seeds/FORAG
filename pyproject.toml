[project]
name = "fashion-care-rag"
version = "0.1.0"
description = "Outdoor functional garment care RAG application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "pydantic-settings>=2.6,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
