[project]
name = "fashion-care-rag"
version = "0.1.0"
description = "Outdoor functional garment care RAG application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "elasticsearch>=9.0,<10",
    "fastapi==0.141.1",
    "langgraph==1.2.11",
    "openai>=1,<3",
    "beautifulsoup4>=4.12,<5",
    "transformers>=4.45,<5",
    "torch>=2.9,<3",
    "playwright>=1.50,<2",
    "pydantic-settings>=2.6,<3",
    "ragchecker==0.1.9",
    "sentence-transformers==5.7.0",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
